name: Validate store site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validate
  cancel-in-progress: true

# GitHub Pages serves from branch main (legacy). Do NOT use
# actions/deploy-pages — multi-file Contents API syncs create many
# deployments that stick at deployment_queued.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require .nojekyll
        run: test -f .nojekyll || (echo "missing .nojekyll" && exit 1)
      - name: HTML pages under apps/ must have index.html
        run: |
          set -euo pipefail
          if [ ! -d apps ]; then
            echo "chưa có apps/ — OK lần bootstrap trống"
            exit 0
          fi
          find apps -type d -mindepth 2 -maxdepth 2 | while read -r d; do
            test -f "$d/index.html" || { echo "thiếu $d/index.html"; exit 1; }
          done
          echo "validate OK"
