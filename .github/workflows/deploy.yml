name: Validate store site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-validate
  cancel-in-progress: true

# Pages = legacy (branch main). Do NOT use actions/deploy-pages:
# multi-file Contents API syncs leave deployments stuck at deployment_queued
# and block all later deploys ("cancel <sha> first").

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require .nojekyll
        run: test -f .nojekyll || (echo "missing .nojekyll" && exit 1)
      - name: apps/*/page/index.html
        run: |
          set -euo pipefail
          [ -d apps ] || exit 0
          find apps -type d -mindepth 2 -maxdepth 2 | while read -r d; do
            test -f "$d/index.html" || { echo "thiếu $d/index.html"; exit 1; }
          done
