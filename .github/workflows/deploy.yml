name: Deploy to GitHub Pages

on:
  # Only manual + explicit legal sync trigger — avoid storm on every Contents API file commit
  workflow_dispatch:
  repository_dispatch:
    types: [af-legal-synced]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # fail in 3 minutes instead of 10 if still queued
          timeout: 180000
