<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBL Technology Limited</title>
  <!-- GitHub Pages SPA redirect: send all unknown paths back to index with hash -->
  <script>
    var seg = window.location.pathname.replace(/^\/[^/]*\//, '/');
    var q = window.location.search.slice(1);
    window.location.replace(
      window.location.origin +
      window.location.pathname.split('/').slice(0, -1).join('/') + '/' +
      '?p=' + encodeURIComponent(seg) + (q ? '&q=' + encodeURIComponent(q) : '') +
      window.location.hash
    );
  </script>
</head>
<body></body>
</html>
